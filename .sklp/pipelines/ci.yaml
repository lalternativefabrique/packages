version: 1
kind: pipeline
name: ci

tools:
  node: "24.16.0"
  pnpm: "11.3.0"
  rust: "1.90.0"

inputs:
  base_ref:
    type: string
    required: false
    default: origin/main

services:
  # Only the modules with integration tests need these, and only they declare
  # them — a unit-test step that pulls a database is a slow step that fails for
  # reasons unrelated to what it tests.
  postgres-test:
    image: postgres:17-alpine
    network: bridge
    env:
      POSTGRES_DB: packages_test
      POSTGRES_USER: packages
      POSTGRES_PASSWORD: packages
    # Speed over durability — this database is thrown away after the run.
    command:
      [
        postgres,
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    # Log probe, not tcp: the port opens during initdb, which then restarts the
    # server, so a tcp check races. This line is only logged once the server
    # actually accepts connections.
    ready:
      log: "database system is ready to accept connections"
      timeout: 60s

  nats-test:
    image: nats:2-alpine
    network: bridge
    # JetStream, not core NATS: the event store, the outbox work-queue and the
    # KV bucket all need it.
    command: ["-js"]
    ready:
      log: "Server is ready"
      timeout: 30s

scopes:
  auth:
    - "auth/**"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  eda:
    - "go/eda/**"
  composition:
    - "go/composition/**"
  retrieval:
    - "go/retrieval/**"
  webhooks:
    - "go/webhooks/**"
  lungor-core:
    - "lungor/core/**"
  lungor-sdk:
    - "lungor/sdk-go/**"
  lungor-policy:
    - "lungor/policy/**"
  skalpai-sdk:
    - "skalpai/sdk-go/**"
  spore-sdk:
    - "spore/**"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"

steps:
  # build, not just typecheck: the package hand-writes the types its consumers
  # compile against, because the plugin-augmented better-auth client cannot be
  # named in a published .d.ts (TS2742). Only emitting the declarations proves
  # the hand-written surface still resolves — `tsc --noEmit` passes on a package
  # whose .d.ts cannot be generated at all.
  - name: auth
    scope: [auth]
    tools: [node]
    run: |
      CI=true npx -y pnpm@11.3.0 install --frozen-lockfile
      npx -y pnpm@11.3.0 --filter @lalternative/auth test
      npx -y pnpm@11.3.0 --filter @lalternative/auth typecheck
      npx -y pnpm@11.3.0 --filter @lalternative/auth build

  # eda's pkg/* are SEPARATE modules, so `go test ./...` at the root does not
  # reach them — outbox/pgx and pgprojector run in production at Lungor and
  # would otherwise be built by nothing here.
  - name: eda
    scope: [eda]
    tools: [go]
    run: |
      cd go/eda
      for mod in . $(find pkg -name go.mod -printf '%h\n' | sort); do
        (cd "$mod" && go build ./... && go vet ./... && go test -count=1 ./...)
      done

  - name: composition
    scope: [composition]
    tools: [go]
    run: |
      cd go/composition
      go build ./... && go vet ./... && go test -count=1 ./...
      go vet -tags=integration ./...

  - name: retrieval
    scope: [retrieval]
    tools: [go]
    run: |
      cd go/retrieval
      go build ./...
      go vet ./...
      go test -count=1 ./...

  # Every published module is built, vetted and unit-tested. These modules are
  # consumed by three products, so a break here is a break there.
  - name: webhooks
    scope: [webhooks]
    tools: [go]
    run: |
      cd go/webhooks
      go build ./...
      go vet ./...
      go test -count=1 ./...

  # The integration tests carry a build tag, so `go test ./...` above does not
  # even COMPILE them. Without this step they are dead code: written, committed,
  # and run by nothing.
  - name: webhooks-integration
    scope: [webhooks]
    depends_on: [webhooks]
    # psql is not listed here: it comes from runner.packages (postgresql-client)
    # in .sklp/space.yaml, not from the toolchain.
    tools: [go]
    services: [postgres-test, nats-test]
    env:
      DATABASE_URL: "postgres://packages:packages@postgres-test:5432/packages_test?sslmode=disable"
      NATS_URL: "nats://nats-test:4222"
    run: |
      # The tests read and write webhook_endpoints but do not create it: the
      # schema ships with the library, and applying it here is what proves the
      # two agree.
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f go/webhooks/migrations/001_webhook_endpoints.up.sql
      cd go/webhooks
      go vet -tags integration ./...
      # -v so a SKIP is visible in the log. These tests skip themselves when
      # NATS or DATABASE_URL are missing, and a silent skip here would look
      # exactly like a pass — which is how they went unrun until this pipeline
      # existed. Never pipe this into a filter: the pipe swallows go test's exit
      # code and turns a failing suite into a green step.
      # pipefail so tee cannot swallow a failing exit code.
      set -o pipefail
      go test -count=1 -v -tags integration ./... 2>&1 | tee /tmp/integration.log
      # Fail on a skip. The suite is green when it skips, so without this the
      # step passes while testing nothing — which is the exact failure this
      # pipeline was written to end.
      if grep -q -- "--- SKIP" /tmp/integration.log; then
        echo "integration tests SKIPPED — backends unreachable, nothing was verified" >&2
        exit 1
      fi

  - name: lungor-core
    scope: [lungor-core]
    tools: [go]
    run: |
      cd lungor/core
      go build ./...
      go vet ./...
      go test -count=1 ./...

  - name: lungor-sdk
    scope: [lungor-sdk]
    tools: [go]
    run: |
      cd lungor/sdk-go
      go build ./...
      go vet ./...
      go test -count=1 ./...

  - name: lungor-policy
    scope: [lungor-policy]
    tools: [go]
    run: |
      cd lungor/policy
      go build ./...
      go vet ./...
      go test -count=1 ./...

  - name: skalpai-sdk
    scope: [skalpai-sdk]
    tools: [go]
    run: |
      cd skalpai/sdk-go
      go build ./...
      go vet ./...
      go test -count=1 ./...

  - name: spore-sdk
    scope: [spore-sdk]
    tools: [go, node, rust]
    run: |
      cd spore/sdk-go
      go build ./...
      go vet ./...
      go test -count=1 ./...
      cd ../..
      CI=true npx -y pnpm@11.3.0 install --frozen-lockfile
      npx -y pnpm@11.3.0 --filter @lalternative/spore-codegen test
      npx -y pnpm@11.3.0 --filter @lalternative/spore-sdk build
      npx -y pnpm@11.3.0 --filter @lalternative/spore-sdk typecheck
      python3 -m compileall -q spore/sdk-python/spore_email
      find spore/sdk-php/lib -type f -name '*.php' -exec sh -c \
        'for file do php -l "$file" >/dev/null || exit 1; done' sh {} +
      find spore/sdk-ruby/lib -type f -name '*.rb' -exec sh -c \
        'for file do ruby -c "$file" >/dev/null || exit 1; done' sh {} +
      cargo check --manifest-path spore/sdk-rust/Cargo.toml
      cargo test --manifest-path spore/sdk-rust/Cargo.toml
