# The transport: every path, method and parameter, generated from Lungor's own
# contract so none of them is typed by hand. A route renamed upstream becomes a
# compile error here rather than a 404 in production.
#
# Internal because it is not the SDK's API. The generated methods return raw
# *http.Response and generated pointer types; the hand-written client wraps them
# to add typed errors, the cache, and the pointer-to-value conversions that make
# "not entitled" distinguishable from "no answer" (see ../../client.go).
package: wire
output: wire.gen.go
generate:
  client: true
  models: true
output-options:
  # A DENY list, deliberately, and this is the important part.
  #
  # An allow list is silent when it is wrong: a route added upstream under a tag
  # nobody listed simply never reaches the SDK — no error, no warning. Both the
  # catalogue and the metering endpoints stayed invisible exactly that way, each
  # until someone noticed by hand. Denying instead means a new app-facing route
  # arrives on its own, and only a new CONSOLE route needs an edit here — which
  # is noticed, because someone just wrote it.
  #
  # What is excluded is the console's own surface: everything under /tenants/ is
  # authenticated by a human's JWT, not by an app key, so an app has nothing to
  # call there.
  exclude-tags: [apps, plans, credentials, billing, console-webhooks, auth]
  # Console routes whose tag they share with app-facing ones. `metering` covers
  # both /metering/usage (app key) and /tenants/…/usage-units (console);
  # `costtracking` covers both /metering/llm-cost/me (app key) and the tenant
  # report + tariff admin under /tenants/…/llm-cost, /tenants/…/llm-tariffs
  # (console, JWT) — the tag alone cannot separate either pair.
  exclude-operation-ids:
    [declareUsageUnit, listUsageUnits, getLLMCostReport, listLLMTariffs, upsertLLMTariff]
